<body>

<!-- ===== HEADER ===== -->
<header class="header">
  <div class="container" style="display:flex;align-items:center;justify-content:space-between;">
    <div class="brand">
      <div class="logo">AI</div>
      <div>
        <div style="font-weight:700">AI-Book-Explorer</div>
        <div style="font-size:0.85rem;color:rgba(255,255,255,0.9)">Recherche & Visualisations</div>
      </div>
    </div>

    <nav class="nav" role="navigation" aria-label="Main navigation">
      <a href="index.html">Accueil</a>
      <a href="visualizations.html">Visualisations</a>
    </nav>

    <button class="menu-btn" aria-expanded="false">Menu</button>
  </div>
</header>

<!-- ===== MAIN WRAPPER ===== -->
<main class="container">

<!-- Top Authors -->
<section id="top-authors-section">
  <h2>Top auteurs (Top 5)</h2>
  <div class="controls">
    <label for="authors-chart-type">Type :</label>
    <select id="authors-chart-type">
      <option value="bar">Barres</option>
      <option value="pie">Camembert</option>
    </select>
    <button id="load-sample-authors">Charger échantillon auteurs</button>
  </div>
  <div class="chart-wrap" style="height:360px; max-width:1000px;">
    <canvas id="topAuthorsChart"></canvas>
  </div>
</section>

<!-- Timeline -->
<section id="charts-section">
  <h2>Timeline</h2>
  <div class="controls">
    <label for="chart-type">Type :</label>
    <select id="chart-type">
      <option value="line">Ligne</option>
      <option value="bar">Barres</option>
    </select>
    <button id="load-sample">Charger échantillon</button>
  </div>
  <div class="chart-wrap" style="height:360px;">
    <canvas id="timelineChart"></canvas>
  </div>
</section>

</main>

<!-- ===== FOOTER ===== -->
<footer class="footer">

  </div>
</footer>
