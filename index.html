<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Book Explorer</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  **<link rel="stylesheet" href="assets/css/filters.css">**  <!-- NOUVEAU : CSS des filtres -->

  <meta name="description" content="AI Book Explorer – Trouvez vos livres facilement grâce à une recherche intelligente.">
</head>

<body>
  <!-- Background layers -->
  <div class="bg" aria-hidden="true">
    <div class="bg-layer"></div>
    <canvas id="bgParticles" aria-hidden="true"></canvas>
  </div>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-container center-header">

      <!-- Logo image (veille à ce que le chemin existe: assets/img/icone.png) -->
      <img src="assets/img/icone.png" alt="Logo AI Book Explorer" class="logo-img"/>

      <!-- Title block centered -->
      <div class="title-box">
        <h1 class="main-title">AI Book Explorer</h1>
        <p class="subtitle">Trouvez vos livres à partir d'ici !</p>
      </div>

    </div>
  </header>

  <main class="container main-content">
    <section class="search-wrap" aria-label="Recherche de livres">
      <div class="search-inner">
        <input id="searchInput" type="search" placeholder="Rechercher des livres (ex: Robots, Love, War)" aria-label="Recherche de livres" />
        <button id="searchBtn" aria-label="Lancer la recherche">🔎</button>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    **<!-- NOUVEAU : Bouton toggle pour mobile -->
    <button id="filters-toggle" class="filters-toggle" aria-label="Ouvrir les filtres">F</button>**

    **<!-- NOUVEAU : Panneau de filtres (à gauche sur desktop, drawer sur mobile) -->
    <aside id="filters-panel" class="filters-panel" aria-hidden="true">
      <div class="filters-header">
        <h3>Filtres</h3>
        <button id="filters-close" class="filters-close" aria-label="Fermer">×</button>
      </div>
      
      <form id="filters-form">
        <div class="field">
          <label for="author">Auteur</label>
          <input type="text" id="author" name="author" placeholder="ex: Isaac Asimov">
        </div>
        
        <div class="field">
          <label for="category">Catégorie</label>
          <select id="category" name="category">
            <option value="">Toutes</option>
            <option value="Fiction">Fiction</option>
            <option value="Science-fiction">Science-fiction</option>
            <option value="Romance">Romance</option>
            <option value="Histoire">Histoire</option>
          </select>
        </div>
        
        <div class="field">
          <label for="year">Année min.</label>
          <input type="number" id="year" name="year" min="1800" max="2025" placeholder="ex: 2000">
        </div>
        
        <div class="field">
          <label for="type">Type</label>
          <select id="type" name="type">
            <option value="">Tous</option>
            <option value="books">Livres</option>
            <option value="magazines">Magazines</option>
          </select>
        </div>
        
        <div class="field">
          <label for="rating">Note min.</label>
          <select id="rating" name="rating">
            <option value="">Toutes</option>
            <option value="3">3+ étoiles</option>
            <option value="4">4+ étoiles</option>
          </select>
        </div>
        
        <div class="filters-actions">
          <button type="button" id="btn-apply" class="btn-apply" disabled>Appliquer</button>
          <button type="button" id="btn-reset" class="btn-reset" disabled>Réinitialiser</button>
        </div>
      </form>
      
      <div id="filters-chips" class="filters-chips"></div>
      
      <div id="filters-loader" class="filters-loader"></div>
      <div id="filters-status" class="filters-status" aria-live="polite"></div>
    </aside>**

    <section id="results" class="results" aria-live="polite"></section>

    <div class="pagination">
      <button id="prevBtn" class="btn ghost" disabled>Précédent</button>
      <span id="pageInfo" class="page-info"></span>
      <button id="nextBtn" class="btn ghost" disabled>Suivant</button>
    </div>
  </main>

  <!-- Modal detail -->
  <div id="detailModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-content" role="document">
      <button id="closeDetail" class="close" aria-label="Fermer">✕</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <script src="assets/js/bg.js" defer></script>
  <script src="assets/js/app.js" defer></script>
  **<script src="assets/js/readingAnim.js" defer></script>**
  **<!-- NOUVEAUX SCRIPTS POUR FILTRES -->
  <script src="assets/js/filters-ui.js" defer></script>
  <script src="assets/js/search-filters.js" defer></script>**
</body>
</html>
